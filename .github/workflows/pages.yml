# The API site: built from main and deployed to GitHub Pages. Pages source:
# GitHub Actions. No lockfile is committed (this repo ignores package-lock.json),
# so the install is `npm install`, and no `cache: npm` — both `npm ci` and the
# setup-node cache require a committed lockfile.
#
# No tag guard, unlike its twins. Theirs publishes the release tag's code and
# falls back to main for a documentation-only push; here the tag cannot build:
# `v0.0.68` was cut before the release's own version bump, so its
# `src/constants.js` says 0.0.67 while its `package.json` says 0.0.68, and the
# repository's `version-agrees` rollup plugin fails the build on exactly that.
# Until a tag is cut that builds, main is the tree this site publishes — and main
# is where the fix lands. A tag pushed alone does not deploy.
#
# The docs toolchain is the published package, `@nakednous/scholion`, installed
# by the nested project under `tools/docs`; its lock is committed, so the step is
# `npm ci --prefix tools/docs`.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install --no-audit --no-fund
      - run: npm ci --prefix tools/docs
      - run: npm run build
      - run: npm run docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
